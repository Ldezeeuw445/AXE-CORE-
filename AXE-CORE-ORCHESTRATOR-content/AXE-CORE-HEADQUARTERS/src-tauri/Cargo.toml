[package]
name = "axe-core"
version = "1.0.0"
description = "AXE CORE — AI Operating System"
authors = ["Luka"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.70"

[build-dependencies]
tauri-build = { version = "2.0", features = [] }

[dependencies]
tauri = { version = "2.0", features = ["macos-private-api", "tray-icon"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# macOS-vervaging achter een doorzichtig venster. Zonder dit is het venster
# wel doorzichtig maar zie je je bureaublad SCHERP -- en dat is geen matglas.
[target."cfg(target_os = \"macos\")".dependencies]
window-vibrancy = "0.5"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
