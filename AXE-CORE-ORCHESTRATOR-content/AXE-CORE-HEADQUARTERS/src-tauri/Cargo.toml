[package]
name = "axe-core"
version = "1.0.0"
description = "AXE CORE — AI Operating System"
authors = ["Luka"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.70"

# Android heeft een library-target nodig die de app-logica draagt en een .so
# voor het toestel maakt. De desktop-binary (main.rs) roept dezelfde run() aan.
[lib]
name = "axe_core_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.0", features = [] }

[dependencies]
tauri = { version = "2.0", features = [ "tray-icon"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# macOS-vervaging achter een doorzichtig venster. Zonder dit is het venster
# wel doorzichtig maar zie je je bureaublad SCHERP -- en dat is geen matglas.
[target."cfg(target_os = \"macos\")".dependencies]
window-vibrancy = "0.5"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
