<!doctype html>
<html lang="en" data-look="black">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=384, initial-scale=1" />
  <title>Notifications</title>
  <link rel="stylesheet" href="mockup.css" />
</head>
<body>
  <div class="phone">
    <div class="top"><h1>Waiting</h1><button class="icon" type="button">☀</button></div>
    <div class="scroll">
      <div class="card">
        <div class="kicker">Needs you</div>
        <div class="title">Wingman wants to restart axe_api</div>
        <div class="sub" style="margin:6px 0 10px">VPS RAM 56%. Last crash was Ollama, not API.</div>
        <div class="row"><button class="btn ok">Approve</button><button class="btn no">Decline</button></div>
      </div>
      <div class="card">
        <div class="kicker">Task</div>
        <div class="row"><span class="dot err"></span><div class="grow"><div class="title">Twelve Data budget</div><div class="sub err-txt">Overdue · no spend from phone</div></div></div>
      </div>
      <div class="card">
        <div class="kicker">System</div>
        <div class="row"><span class="dot warn"></span><div class="grow"><div class="title">Mac mini disk 93%</div><div class="sub">Remote: Worker · Screenshot</div></div></div>
      </div>
    </div>
    <nav class="tabs">
      <a href="home.html">Home</a>
      <a href="northsea.html">Desk</a>
      <a class="on" href="agents.html">Agents</a>
      <a href="trading.html">Trading</a>
      <a href="more.html">More</a>
    </nav>
  </div>
</body>
</html>
