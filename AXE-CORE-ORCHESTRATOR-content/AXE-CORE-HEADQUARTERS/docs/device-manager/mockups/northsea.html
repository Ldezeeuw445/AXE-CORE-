<!doctype html>
<html lang="en" data-look="black">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=384, initial-scale=1" />
  <title>NorthSea</title>
  <link rel="stylesheet" href="mockup.css" />
</head>
<body>
  <div class="phone">
    <div class="top"><h1>NorthSea Desk</h1><button class="icon" type="button">☀</button></div>
    <div class="scroll">
      <div class="chips"><span class="chip on">Live</span><span class="chip">Warm</span><span class="chip">Lost</span></div>
      <div class="card">
        <div class="row"><span class="dot ok"></span><div class="grow"><div class="title">NL grain counterpart</div><div class="sub">Warm · next: call Monday</div></div></div>
      </div>
      <div class="card">
        <div class="row"><span class="dot warn"></span><div class="grow"><div class="title">North Sea diesel enquiry</div><div class="sub">Waiting human · no send</div></div></div>
      </div>
      <div class="card">
        <div class="kicker">Rule</div>
        <div class="sub">Agents never approve. No follow-ups on lost/disabled deals. No money from this phone.</div>
      </div>
    </div>
    <nav class="tabs">
      <a href="home.html">Home</a>
      <a class="on" href="northsea.html">Desk</a>
      <a href="agents.html">Agents</a>
      <a href="trading.html">Trading</a>
      <a href="more.html">More</a>
    </nav>
  </div>
</body>
</html>
