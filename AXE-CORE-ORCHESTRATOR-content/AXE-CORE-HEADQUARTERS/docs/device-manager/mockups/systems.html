<!doctype html>
<html lang="en" data-look="black">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=384, initial-scale=1" />
  <title>Systems</title>
  <link rel="stylesheet" href="mockup.css" />
</head>
<body>
  <div class="phone">
    <div class="top"><h1>Your systems</h1><button class="icon" type="button">☀</button></div>
    <div class="scroll">
      <div class="tiny" style="margin-bottom:8px">4/4 online · remote actions confirm first</div>
      <div class="card">
        <div class="row"><span class="dot ok"></span><div class="grow title">Mac mini</div><span class="tiny">Online</span></div>
        <div class="grid2"><div class="metric">CPU<b>40%</b></div><div class="metric">RAM<b>75%</b></div><div class="metric">Disk<b class="warn-txt">93%</b></div></div>
        <div class="row"><button class="btn">Wake</button><button class="btn">Screenshot</button><button class="btn">Worker</button></div>
      </div>
      <div class="card">
        <div class="row"><span class="dot ok"></span><div class="grow title">iMac</div><span class="tiny">Online</span></div>
        <div class="grid2"><div class="metric">CPU<b>34%</b></div><div class="metric">RAM<b>68%</b></div><div class="metric">Disk<b class="warn-txt">91%</b></div></div>
        <div class="row"><button class="btn">Wake</button><button class="btn">Screenshot</button></div>
      </div>
      <div class="card">
        <div class="row"><span class="dot ok"></span><div class="grow title">VPS API</div><span class="tiny">api.axecompanion.com</span></div>
        <div class="grid2"><div class="metric">CPU<b>37%</b></div><div class="metric">RAM<b>56%</b></div></div>
        <div class="row"><button class="btn">Health</button><button class="btn">Logs</button><button class="btn">Restart</button></div>
      </div>
      <div class="card">
        <div class="row"><span class="dot ok"></span><div class="grow title">VPS Models</div><span class="tiny">cgroup limited</span></div>
        <div class="grid2"><div class="metric">CPU<b>0%</b></div><div class="metric">RAM<b>5%</b></div></div>
        <div class="row"><button class="btn">Health</button></div>
      </div>
    </div>
    <nav class="tabs">
      <a href="home.html">Home</a>
      <a href="northsea.html">Desk</a>
      <a href="agents.html">Agents</a>
      <a href="trading.html">Trading</a>
      <a class="on" href="more.html">More</a>
    </nav>
  </div>
</body>
</html>
