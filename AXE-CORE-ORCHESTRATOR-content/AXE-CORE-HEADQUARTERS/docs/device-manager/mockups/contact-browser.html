<!doctype html>
<html><head><meta charset="utf-8" />
<style>
  html,body{margin:0;background:#050608;color:#e8eaee;font-family:Inter,sans-serif}
  .sheet{padding:16px}
  h1{font-size:13px;letter-spacing:.14em;text-transform:uppercase;margin:0 0 12px;font-weight:650}
  .grid{display:grid;grid-template-columns:repeat(3,192px);gap:10px}
  figure{margin:0}
  img{width:192px;height:416px;object-fit:cover;border-radius:10px;display:block}
  figcaption{font-size:10px;opacity:.6;margin-top:4px}
</style></head>
<body><div class="sheet"><h1>browser · light</h1>
<div class="grid">
<figure><img src="browser-start-light.png" alt="browser-start" /><figcaption>browser-start</figcaption></figure>
<figure><img src="browser-page-light.png" alt="browser-page" /><figcaption>browser-page</figcaption></figure>
<figure><img src="browser-tabs-light.png" alt="browser-tabs" /><figcaption>browser-tabs</figcaption></figure>
<figure><img src="browser-bookmarks-light.png" alt="browser-bookmarks" /><figcaption>browser-bookmarks</figcaption></figure>
<figure><img src="browser-reader-light.png" alt="browser-reader" /><figcaption>browser-reader</figcaption></figure>
</div></div></body></html>
