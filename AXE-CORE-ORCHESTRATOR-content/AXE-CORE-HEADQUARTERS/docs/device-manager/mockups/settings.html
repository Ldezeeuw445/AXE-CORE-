<!doctype html>
<html lang="en" data-look="black">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=384, initial-scale=1" />
  <title>Settings</title>
  <link rel="stylesheet" href="mockup.css" />
</head>
<body>
  <div class="phone">
    <div class="top"><h1>Settings</h1><button class="icon" type="button">☀</button></div>
    <div class="scroll">
      <div class="card">
        <div class="kicker">Look</div>
        <div class="row"><div class="grow title">Dark</div><span class="ok-txt">on</span></div>
        <div class="row"><div class="grow title">Light</div><span class="tiny">glass</span></div>
      </div>
      <div class="card">
        <div class="kicker">Transparency · dark</div>
        <div class="sub">Wallpaper shows through the plate. Saved as axe_wp_dim_black.</div>
        <div class="slider"></div>
        <div class="tiny">Blur</div>
        <div class="slider" style="margin-top:14px"></div>
      </div>
      <div class="card">
        <div class="kicker">Transparency · light</div>
        <div class="sub">Separate slider. Does not overwrite dark. axe_wp_dim_glass.</div>
        <div class="slider"></div>
      </div>
      <div class="card">
        <div class="kicker">PIN</div>
        <div class="row"><div class="grow title">Numeric PIN</div><span class="tiny">not set</span></div>
        <div class="row"><button class="btn">Set PIN</button><button class="btn">Remove</button></div>
      </div>
      <div class="card">
        <div class="kicker">Mic</div>
        <div class="row"><div class="grow title">Listen only on tap</div><span class="ok-txt">on</span></div>
        <div class="row"><div class="grow title">Hey AXE</div><span class="tiny">off</span></div>
      </div>
    </div>
    <nav class="tabs">
      <a href="home.html">Home</a>
      <a href="northsea.html">Desk</a>
      <a href="agents.html">Agents</a>
      <a href="trading.html">Trading</a>
      <a class="on" href="more.html">More</a>
    </nav>
  </div>
</body>
</html>
