<!doctype html>
<html><head><meta charset="utf-8" />
<style>
  html,body{margin:0;background:#050608;color:#e8eaee;font-family:Inter,sans-serif}
  .sheet{padding:16px}
  h1{font-size:13px;letter-spacing:.14em;text-transform:uppercase;margin:0 0 12px;font-weight:650}
  .grid{display:grid;grid-template-columns:repeat(3,192px);gap:10px}
  figure{margin:0}
  img{width:192px;height:416px;object-fit:cover;border-radius:10px;display:block}
  figcaption{font-size:10px;opacity:.6;margin-top:4px}
</style></head>
<body><div class="sheet"><h1>companion · light</h1>
<div class="grid">
<figure><img src="companion-home-light.png" alt="companion-home" /><figcaption>companion-home</figcaption></figure>
<figure><img src="companion-markets-light.png" alt="companion-markets" /><figcaption>companion-markets</figcaption></figure>
<figure><img src="companion-chart-light.png" alt="companion-chart" /><figcaption>companion-chart</figcaption></figure>
<figure><img src="companion-axe-light.png" alt="companion-axe" /><figcaption>companion-axe</figcaption></figure>
<figure><img src="companion-account-light.png" alt="companion-account" /><figcaption>companion-account</figcaption></figure>
</div></div></body></html>
