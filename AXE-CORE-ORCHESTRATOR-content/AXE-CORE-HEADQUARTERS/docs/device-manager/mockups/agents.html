<!doctype html>
<html lang="en" data-look="black">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=384, initial-scale=1" />
  <title>Agents</title>
  <link rel="stylesheet" href="mockup.css" />
</head>
<body>
  <div class="phone">
    <div class="top"><h1>Agents</h1><button class="icon" type="button">☀</button></div>
    <div class="scroll">
      <div class="card">
        <div class="kicker">Waiting · 1</div>
        <div class="row">
          <span class="dot warn"></span>
          <div class="grow">
            <div class="title">Wingman</div>
            <div class="sub warn-txt">Restart axe_api on VPS?</div>
          </div>
        </div>
        <div class="row">
          <button class="btn ok">Approve</button>
          <button class="btn no">Decline</button>
        </div>
      </div>
      <div class="card">
        <div class="kicker">Working</div>
        <div class="row"><span class="dot ok"></span><div class="grow"><div class="title">Trading</div><div class="sub">Watching XAUUSD 1D — no orders</div></div></div>
        <div class="row"><span class="dot ok"></span><div class="grow"><div class="title">NorthSea</div><div class="sub">Refreshing counterparties</div></div></div>
      </div>
      <div class="card">
        <div class="kicker">Idle</div>
        <div class="row"><span class="dot" style="background:#64748b"></span><div class="grow title">Developer</div></div>
        <div class="row"><span class="dot" style="background:#64748b"></span><div class="grow title">ThinkTank</div></div>
        <div class="row"><span class="dot" style="background:#64748b"></span><div class="grow title">Companion</div></div>
      </div>
    </div>
    <nav class="tabs">
      <a href="home.html">Home</a>
      <a href="northsea.html">Desk</a>
      <a class="on" href="agents.html">Agents</a>
      <a href="trading.html">Trading</a>
      <a href="more.html">More</a>
    </nav>
  </div>
</body>
</html>
