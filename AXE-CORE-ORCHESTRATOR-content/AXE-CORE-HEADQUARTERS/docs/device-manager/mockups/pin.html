<!doctype html>
<html lang="en" data-look="black">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=384, initial-scale=1" />
  <title>PIN</title>
  <link rel="stylesheet" href="mockup.css" />
</head>
<body>
  <div class="phone">
    <div class="top"><button class="icon" type="button">☀</button><span></span></div>
    <div style="text-align:center;margin-top:36px">
      <div style="font-size:18px;font-weight:600">Enter PIN</div>
      <div class="dots"><i></i><i></i><i></i><i></i></div>
    </div>
    <div class="pad">
      <div class="key">1</div><div class="key">2</div><div class="key">3</div>
      <div class="key">4</div><div class="key">5</div><div class="key">6</div>
      <div class="key">7</div><div class="key">8</div><div class="key">9</div>
      <div></div><div class="key">0</div><div class="key">⌫</div>
    </div>
  </div>
</body>
</html>
