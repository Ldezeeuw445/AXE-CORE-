<!doctype html>
<html><head><meta charset="utf-8" />
<style>
  html,body{margin:0;background:#050608;color:#e8eaee;font-family:Inter,sans-serif}
  .sheet{padding:16px}
  h1{font-size:13px;letter-spacing:.14em;text-transform:uppercase;margin:0 0 12px;font-weight:650}
  .grid{display:grid;grid-template-columns:repeat(3,192px);gap:10px}
  figure{margin:0}
  img{width:192px;height:416px;object-fit:cover;border-radius:10px;display:block}
  figcaption{font-size:10px;opacity:.6;margin-top:4px}
</style></head>
<body><div class="sheet"><h1>axon · light</h1>
<div class="grid">
<figure><img src="axon-home-light.png" alt="axon-home" /><figcaption>axon-home</figcaption></figure>
<figure><img src="axon-capture-light.png" alt="axon-capture" /><figcaption>axon-capture</figcaption></figure>
<figure><img src="axon-thread-light.png" alt="axon-thread" /><figcaption>axon-thread</figcaption></figure>
<figure><img src="axon-cores-light.png" alt="axon-cores" /><figcaption>axon-cores</figcaption></figure>
<figure><img src="axon-obsidian-light.png" alt="axon-obsidian" /><figcaption>axon-obsidian</figcaption></figure>
<figure><img src="axon-trading-light.png" alt="axon-trading" /><figcaption>axon-trading</figcaption></figure>
</div></div></body></html>
