<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<title>Computer use — AXE Core v2</title>
<link rel="stylesheet" href="_all.css"/>
<style>
body { width: 1440px; height: 900px; overflow: hidden; }
.app { width: 1440px; height: 900px; }

.cu { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; height: 100%; }
.screen {
  border-radius: 16px; border: 1px solid var(--line); background: #0a0c10;
  aspect-ratio: 16/10; position: relative; overflow: hidden;
  box-shadow: inset 0 0 80px rgba(34,211,238,.04);
}
.screen::after {
  content: "Desktop stream"; position: absolute; inset: 0; display: grid; place-items: center;
  color: var(--dim); font-size: 13px;
}
.men { position: absolute; top: 0; left: 0; right: 0; height: 28px; background: rgba(255,255,255,.04); border-bottom: 1px solid var(--line); z-index: 1; }
.dock { position: absolute; bottom: 12px; left: 50%; transform: translateX(-50%); display: flex; gap: 6px; z-index: 1; }
.dock span { width: 36px; height: 36px; border-radius: 10px; background: rgba(255,255,255,.08); border: 1px solid var(--line); }

</style>
</head>

<div class="app">
