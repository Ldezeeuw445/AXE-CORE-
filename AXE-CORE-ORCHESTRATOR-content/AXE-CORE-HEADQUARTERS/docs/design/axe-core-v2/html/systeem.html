<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<title>Systeem — AXE Core v2</title>
<link rel="stylesheet" href="_all.css"/>
<style>
body { width: 1440px; height: 900px; overflow: hidden; }
.app { width: 1440px; height: 900px; }

.sys { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; }
.tile { padding: 18px; min-height: 140px; }
.ok { color: var(--green); font-size: 13px; margin-top: 18px; }

</style>
</head>
<body>
<div class="app">
<aside class="rail"><div class="logo">AX</div>
<div class="nav-item" title="home"><svg viewBox="0 0 24 24"><path d="M4 10.5 12 4l8 6.5V20a1 1 0 0 1-1 1h-5v-6H10v6H5a1 1 0 0 1-1-1z"/></svg></div>
<div class="nav-item" title="managers"><svg viewBox="0 0 24 24"><circle cx="9" cy="8" r="3"/><circle cx="16" cy="9" r="2.5"/><path d="M3 19c1.5-3 4-4.5 6-4.5S13.5 16 15 19"/><path d="M14 14.5c1.2 0 2.8.7 4 2.5"/></svg></div>
<div class="nav-item" title="northsea"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><path d="M4 12h16M12 4c2.5 2.8 2.5 9.2 0 16M12 4c-2.5 2.8-2.5 9.2 0 16"/></svg></div>
<div class="nav-item" title="trading"><svg viewBox="0 0 24 24"><path d="M4 16l5-5 4 3 7-8"/><path d="M15 6h5v5"/></svg></div>
<div class="nav-item" title="bouwen"><svg viewBox="0 0 24 24"><rect x="4" y="4" width="7" height="7" rx="1.5"/><rect x="13" y="4" width="7" height="7" rx="1.5"/><rect x="4" y="13" width="7" height="7" rx="1.5"/><rect x="13" y="13" width="7" height="7" rx="1.5"/></svg></div>
<div class="nav-item active" title="systeem"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 3v2M12 19v2M3 12h2M19 12h2M5.6 5.6l1.4 1.4M17 17l1.4 1.4M5.6 18.4 7 17M17 7l1.4-1.4"/></svg></div>
<div class="rail-spacer"></div>
<div class="nav-item" title="AXE"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M8 12h8M12 8v8"/></svg></div>
</aside>
<div class="main">


<div class="topbar">
  <h1>Systeem <span class="sub">Health · machines · connectors</span></h1>
  <span class="pill live">Healthy</span>
</div>
<div class="content">
  <div class="sys">
    <div class="card tile"><div class="label">Orchestrator</div><div class="metric" style="font-size:20px;margin-top:8px">Single layer</div><div class="ok">● Routing OK</div></div>
    <div class="card tile"><div class="label">Mac mini</div><div class="metric" style="font-size:20px;margin-top:8px">Computer use</div><div class="ok">● Online</div></div>
    <div class="card tile"><div class="label">iMac</div><div class="metric" style="font-size:20px;margin-top:8px">Computer use</div><div class="ok">● Online</div></div>
    <div class="card tile"><div class="label">Gmail · NorthSea</div><div class="metric" style="font-size:20px;margin-top:8px">Connector</div><div class="ok">● Linked</div></div>
    <div class="card tile"><div class="label">Supabase desk</div><div class="metric" style="font-size:20px;margin-top:8px">opportunities</div><div class="metric-sub" style="margin-top:8px;color:var(--amber)">⚠ Stage lag vs Gmail</div></div>
    <div class="card tile"><div class="label">Overlay</div><div class="metric" style="font-size:20px;margin-top:8px">Always-on</div><div class="ok">● Available without Tauri</div></div>
  </div>
</div>

</div>
</div>
</body>
