<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<title>Browser — AXE Core v2</title>
<link rel="stylesheet" href="_all.css"/>
<style>
body { width: 1440px; height: 900px; overflow: hidden; }
.app { width: 1440px; height: 900px; }

.browser { display: flex; flex-direction: column; height: 100%; border-radius: 16px; border: 1px solid var(--line); overflow: hidden; background: #050608; }
.bar { display: flex; gap: 8px; align-items: center; padding: 10px 12px; background: var(--elev); border-bottom: 1px solid var(--line); }
.url { flex: 1; background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 8px 12px; font-size: 12.5px; color: var(--muted); }
.viewport { flex: 1; background: linear-gradient(180deg,#0c1218,#06080c); display: grid; place-items: center; color: var(--dim); font-size: 13px; }
.axe-rail { width: 300px; border-left: 1px solid var(--line); background: var(--panel); padding: 16px; display: flex; flex-direction: column; gap: 12px; }
.wrap { display: grid; grid-template-columns: 1fr 300px; height: calc(100% - 0px); gap: 0; }

</style>
</head>
<body>
<div class="app">
<aside class="rail"><div class="logo">AX</div>
<div class="nav-item active" title="home"><svg viewBox="0 0 24 24"><path d="M4 10.5 12 4l8 6.5V20a1 1 0 0 1-1 1h-5v-6H10v6H5a1 1 0 0 1-1-1z"/></svg></div>
<div class="nav-item" title="managers"><svg viewBox="0 0 24 24"><circle cx="9" cy="8" r="3"/><circle cx="16" cy="9" r="2.5"/><path d="M3 19c1.5-3 4-4.5 6-4.5S13.5 16 15 19"/><path d="M14 14.5c1.2 0 2.8.7 4 2.5"/></svg></div>
<div class="nav-item" title="northsea"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><path d="M4 12h16M12 4c2.5 2.8 2.5 9.2 0 16M12 4c-2.5 2.8-2.5 9.2 0 16"/></svg></div>
<div class="nav-item" title="trading"><svg viewBox="0 0 24 24"><path d="M4 16l5-5 4 3 7-8"/><path d="M15 6h5v5"/></svg></div>
<div class="nav-item" title="bouwen"><svg viewBox="0 0 24 24"><rect x="4" y="4" width="7" height="7" rx="1.5"/><rect x="13" y="4" width="7" height="7" rx="1.5"/><rect x="4" y="13" width="7" height="7" rx="1.5"/><rect x="13" y="13" width="7" height="7" rx="1.5"/></svg></div>
<div class="nav-item" title="systeem"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 3v2M12 19v2M3 12h2M19 12h2M5.6 5.6l1.4 1.4M17 17l1.4 1.4M5.6 18.4 7 17M17 7l1.4-1.4"/></svg></div>
<div class="rail-spacer"></div>
<div class="nav-item" title="AXE"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M8 12h8M12 8v8"/></svg></div>
</aside>
<div class="main">


<div class="topbar">
  <h1>Browser <span class="sub">In-app · AXE can see & act</span></h1>
  <span class="pill cyan">Computer use lane</span>
</div>
<div class="content" style="padding-top:12px">
  <div class="wrap" style="height:100%;border-radius:16px;overflow:hidden;border:1px solid var(--line)">
    <div class="browser" style="border:none;border-radius:0">
      <div class="bar">
        <button class="btn ghost">←</button><button class="btn ghost">→</button>
        <div class="url">https://northseacommodity.com</div>
        <button class="btn primary">Ask AXE</button>
      </div>
      <div class="viewport">Page content · AXE observes this tab</div>
    </div>
    <div class="axe-rail">
      <div class="label">AXE on this page</div>
      <div style="font-size:13px;color:var(--muted);line-height:1.5">Summarize, extract counterparties, or draft follow-ups without leaving the shell.</div>
      <div class="ask-box" style="display:flex;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px">
        <input style="flex:1;background:transparent;border:none;color:var(--text);outline:none;font-size:12.5px" value="Extract key contacts…" readonly/>
      </div>
      <button class="btn primary" style="width:100%">Run</button>
    </div>
  </div>
</div>

</div>
</div>
</body>
</html>
