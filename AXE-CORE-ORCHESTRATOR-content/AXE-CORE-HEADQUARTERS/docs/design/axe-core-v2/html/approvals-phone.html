<!DOCTYPE html>
<html><head><meta charset="utf-8"/><style>
*{box-sizing:border-box;margin:0;padding:0}
body{width:1440px;height:900px;background:#0a0a0a;font-family:Inter,system-ui,sans-serif;display:grid;place-items:center;color:#E8EAED}
.phone{width:380px;height:780px;border-radius:40px;background:#000;border:3px solid #333;padding:16px 14px;box-shadow:0 40px 100px rgba(0,0,0,.7)}
.notch{width:120px;height:28px;background:#111;border-radius:0 0 16px 16px;margin:0 auto 14px}
.label{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:#5C636E;font-weight:600}
h1{font-size:22px;font-weight:600;margin-top:6px}
.sub{font-size:12.5px;color:#8B929C;margin-top:4px;margin-bottom:18px}
.card{margin-bottom:12px;padding:16px;border-radius:16px;background:#0E1116;border:1px solid rgba(255,255,255,.08)}
.card .t{font-weight:600;font-size:14px}
.card .d{font-size:12.5px;color:#8B929C;margin:6px 0 12px}
.row{display:flex;gap:8px}
.btn{flex:1;height:36px;border-radius:10px;font-size:13px;font-weight:500;border:1px solid rgba(255,255,255,.12);background:#12161C;color:#E8EAED;cursor:pointer}
.btn.p{background:linear-gradient(180deg,rgba(34,211,238,.25),rgba(34,211,238,.12));border-color:rgba(34,211,238,.45);color:#A5F3FC}
.cap{position:fixed;bottom:36px;left:0;right:0;text-align:center;font-size:13px;color:#6F757E}
</style></head><body>
<div class="phone">
  <div class="notch"></div>
  <div class="label">AXE · Approvals</div>
  <h1>Needs you</h1>
  <div class="sub">Mirrored from Home · Samsung</div>
  <div class="card"><div class="t">NorthSea · buyer intro</div><div class="d">Harcros · after signed NCNDA</div><div class="row"><button class="btn">Deny</button><button class="btn p">Approve</button></div></div>
  <div class="card"><div class="t">Mac mini · take control</div><div class="d">Computer use request</div><div class="row"><button class="btn">Deny</button><button class="btn p">Approve</button></div></div>
  <div class="card"><div class="t">Trading · confirm</div><div class="d">Same orchestrator event as Home</div><div class="row"><button class="btn">Deny</button><button class="btn p">Approve</button></div></div>
</div>
<div class="cap">Samsung approvals · same events as Home</div>
</body></html>
