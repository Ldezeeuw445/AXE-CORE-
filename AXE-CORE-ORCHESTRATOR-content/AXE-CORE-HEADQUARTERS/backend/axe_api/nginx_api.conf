# Nginx config for api.axecompanion.com
# Add this to /etc/nginx/sites-available/api.axecompanion.com
# Then: ln -s /etc/nginx/sites-available/api.axecompanion.com /etc/nginx/sites-enabled/
# Then: certbot --nginx -d api.axecompanion.com

server {
    listen 80;
    server_name api.axecompanion.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name api.axecompanion.com;

    ssl_certificate     /etc/letsencrypt/live/api.axecompanion.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.axecompanion.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    # Live preview — proxies the Code Editor's dev server (started via
    # POST /preview/start, always on PREVIEW_PORT) so Code Studio can iframe
    # it. Host is rewritten to 127.0.0.1 so Vite's allowedHosts check (which
    # otherwise 403s on an unrecognized Host header) sees a local request.
    # No X-Frame-Options here on purpose — this response IS meant to be
    # framed by www.axeheadquarters.com.
    location /preview/ {
        proxy_pass         http://127.0.0.1:4700/;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host 127.0.0.1;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400;
        proxy_send_timeout 86400;
        proxy_buffering    off;
    }

    # Prefix match (not exact `= /terminal`) with NO URI on proxy_pass, so the
    # original path is forwarded verbatim. This makes ALL of /terminal,
    # /terminal/ws and /terminal?token=... reach the WS server — the terminal
    # client dials /terminal/ws when VITE_TERMINAL_WS_URL is set, and the old
    # exact match silently dropped that to the API (→ close code 1006). The WS
    # server upgrades on any path, so it doesn't care which suffix arrives.
    location /terminal {
        proxy_pass         http://127.0.0.1:4022;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400;
        proxy_send_timeout 86400;
        proxy_buffering    off;
    }

    location / {
        # Security headers — scoped to the JSON API only (not /preview, which
        # must stay frameable, and not /terminal, which doesn't need them).
        add_header X-Content-Type-Options nosniff;
        add_header X-Frame-Options DENY;
        add_header X-XSS-Protection "1; mode=block";

        proxy_pass         http://127.0.0.1:8001;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_buffering    off;
    }
}
