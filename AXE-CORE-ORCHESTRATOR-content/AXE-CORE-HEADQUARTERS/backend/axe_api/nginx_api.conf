# Nginx config for api.axecompanion.com
# Add this to /etc/nginx/sites-available/api.axecompanion.com
# Then: ln -s /etc/nginx/sites-available/api.axecompanion.com /etc/nginx/sites-enabled/
# Then: certbot --nginx -d api.axecompanion.com

server {
    listen 80;
    server_name api.axecompanion.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name api.axecompanion.com;

    ssl_certificate     /etc/letsencrypt/live/api.axecompanion.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.axecompanion.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    # These three are FastAPI control endpoints (start/stop/status the dev
    # server), not part of what the dev server itself serves — they must NOT
    # fall into the /preview/ passthrough below (which proxies to the dev
    # server on :4700 and can't be used to start itself — a real chicken-
    # and-egg 502 until these were added). Exact-match locations take
    # priority over the prefix match below regardless of file order.
    location = /preview/start {
        proxy_pass         http://127.0.0.1:8001;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }
    location = /preview/stop {
        proxy_pass         http://127.0.0.1:8001;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }
    location = /preview/status {
        proxy_pass         http://127.0.0.1:8001;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # Live preview — proxies the Code Editor's dev server (started via
    # POST /preview/start, always on PREVIEW_PORT) so Code Studio can iframe
    # it. Host is rewritten to 127.0.0.1 so Vite's allowedHosts check (which
    # otherwise 403s on an unrecognized Host header) sees a local request.
    # No X-Frame-Options here on purpose — this response IS meant to be
    # framed by www.axeheadquarters.com.
    location /preview/ {
        proxy_pass         http://127.0.0.1:4700/;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host 127.0.0.1;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400;
        proxy_send_timeout 86400;
        proxy_buffering    off;
    }

    # Prefix match (not exact `= /terminal`) with NO URI on proxy_pass, so the
    # original path is forwarded verbatim. This makes ALL of /terminal,
    # /terminal/ws and /terminal?token=... reach the WS server — the terminal
    # client dials /terminal/ws when VITE_TERMINAL_WS_URL is set, and the old
    # exact match silently dropped that to the API (→ close code 1006). The WS
    # server upgrades on any path, so it doesn't care which suffix arrives.
    location /terminal {
        proxy_pass         http://127.0.0.1:4022;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400;
        proxy_send_timeout 86400;
        proxy_buffering    off;
    }

    # OpenHands sandbox spin-up + agent-loop reply can legitimately take up
    # to ~210s (90s sandbox-ready budget + 120s reply-poll budget, see
    # backend/axe_api/main.py's exec_openhands). The generic 60s timeout below
    # cut every real OpenHands call off with a 504 before the backend's own
    # (longer) timeout ever had a chance to fire. 240s gives margin.
    location /internal/openhands/ {
        proxy_pass         http://127.0.0.1:8001;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 240s;
        proxy_buffering    off;
    }

    # /proxy/ai's own httpx client budgets 90s for Ollama specifically (cold
    # model loads on this CPU-only, single-model-at-a-time Hetzner box can
    # take that long — see main.py's proxy_timeout). The generic 60s below
    # cut the client connection before that budget ever mattered: confirmed
    # live, a Settings "Test" on the slowest catalog model 504'd at exactly
    # 60s while the backend was still faithfully waiting on Ollama.
    location /proxy/ai {
        proxy_pass         http://127.0.0.1:8001;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 100s;
        proxy_buffering    off;
    }

    # /crew/run's own subprocess budgets 600s (CREW_TIMEOUT, crew_runner.py) —
    # sequential Ollama specialist calls on this CPU-only box add up fast.
    # The generic 60s below cut every real crew run off with a silent 504
    # before that budget ever mattered, and the client (runTradingResearch.ts)
    # swallows that failure and falls back to canned template text with no
    # visible error — so research looked like it was working when it never
    # once reached the crew. 620s gives margin over the backend's own budget.
    # Confirmed live: a real /crew/run completed in ~73s at HTTP 200 once
    # this was in place, vs. a 504 at exactly 60s before it.
    location /crew/run {
        proxy_pass         http://127.0.0.1:8001;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 620s;
        proxy_buffering    off;
    }

    # /flow/run (the deep 18-agent flow) budgets even longer — FLOW_TIMEOUT
    # defaults to 1800s in flow_runner.py. Same silent-504-then-fallback
    # failure mode as /crew/run above without this override.
    location /flow/run {
        proxy_pass         http://127.0.0.1:8001;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 1850s;
        proxy_buffering    off;
    }

    location / {
        # Security headers — scoped to the JSON API only (not /preview, which
        # must stay frameable, and not /terminal, which doesn't need them).
        add_header X-Content-Type-Options nosniff;
        add_header X-Frame-Options DENY;
        add_header X-XSS-Protection "1; mode=block";

        proxy_pass         http://127.0.0.1:8001;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_buffering    off;
    }
}
