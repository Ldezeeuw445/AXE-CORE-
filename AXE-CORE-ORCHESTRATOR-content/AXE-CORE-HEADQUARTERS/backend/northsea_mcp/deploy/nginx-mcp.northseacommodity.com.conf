# /etc/nginx/sites-available/mcp.northseacommodity.com
# Het certificaat komt van certbot (zelfde werkwijze als api.axecompanion.com).
# DNS: A-record mcp.northseacommodity.com -> 212.227.91.79, in Cloudflare op
# "DNS only" (grijze wolk); anders kan certbot de http-01-uitdaging niet halen.

# Begrenzing van de OAuth-endpoints staat in conf.d/northsea-mcp-limits.conf:
#   limit_req_zone $binary_remote_addr zone=northsea_oauth:10m rate=20r/m;

server {
    listen 80;
    listen [::]:80;
    server_name mcp.northseacommodity.com;

    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name mcp.northseacommodity.com;

    ssl_certificate     /etc/letsencrypt/live/mcp.northseacommodity.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mcp.northseacommodity.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;

    client_max_body_size 1m;
    server_tokens off;

    location /oauth/ {
        limit_req zone=northsea_oauth burst=20 nodelay;
        proxy_pass         http://127.0.0.1:8040;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto https;
    }

    location = /mcp {
        proxy_pass         http://127.0.0.1:8040;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto https;
        proxy_set_header   Connection "";
        proxy_buffering    off;
        proxy_read_timeout 200s;
        proxy_send_timeout 200s;
    }

    location / {
        proxy_pass         http://127.0.0.1:8040;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto https;
        proxy_read_timeout 30s;
    }
}
