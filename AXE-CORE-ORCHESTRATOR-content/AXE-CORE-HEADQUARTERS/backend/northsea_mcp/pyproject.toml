[project]
name = "northsea-mcp"
version = "1.0.0"
description = "Remote MCP interface for NorthSea Commodity Partners inside AXE CORE"
requires-python = ">=3.12"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
  "live: talks to the real AXE Commodities database (read-only); needs NORTHSEA_LIVE=1",
]
