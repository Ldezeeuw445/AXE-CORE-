<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- maximum-scale=1 + user-scalable=no: this is an app-shell dashboard,
         never a reading/content page, so pinch-zoom has no legitimate use
         here — it was only ever the source of "launches zoomed in wrong,
         have to pinch it back every time" reports, worst on iOS Home
         Screen standalone launches (apple-mobile-web-app-capable below),
         which render this initial viewport state differently from a
         regular Safari tab. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>AXE CORE</title>
    <!-- Favicon & app icons -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
  <!-- iOS Splash Screens -->
  <link rel="apple-touch-startup-image" media="screen and (device-width: 430px) and (device-height: 932px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" href="/splash/iPhone_14_Pro_Max.png" />
  <link rel="apple-touch-startup-image" media="screen and (device-width: 393px) and (device-height: 852px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" href="/splash/iPhone_14_Pro.png" />
  <link rel="apple-touch-startup-image" media="screen and (device-width: 390px) and (device-height: 844px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" href="/splash/iPhone_14.png" />
  <link rel="apple-touch-startup-image" media="screen and (device-width: 375px) and (device-height: 812px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" href="/splash/iPhone_13_mini.png" />
  <link rel="apple-touch-startup-image" media="screen and (device-width: 414px) and (device-height: 896px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" href="/splash/iPhone_11_Pro_Max.png" />
  <link rel="apple-touch-startup-image" media="screen and (device-width: 414px) and (device-height: 896px) and (-webkit-device-pixel-ratio: 2) and (orientation: portrait)" href="/splash/iPhone_11.png" />
  <link rel="apple-touch-startup-image" media="screen and (device-width: 414px) and (device-height: 736px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" href="/splash/iPhone_8_Plus.png" />
  <link rel="apple-touch-startup-image" media="screen and (device-width: 375px) and (device-height: 667px) and (-webkit-device-pixel-ratio: 2) and (orientation: portrait)" href="/splash/iPhone_8.png" />
  <link rel="apple-touch-startup-image" media="screen and (device-width: 810px) and (device-height: 1080px) and (-webkit-device-pixel-ratio: 2) and (orientation: portrait)" href="/splash/iPad_10.2.png" />
  <link rel="apple-touch-startup-image" media="screen and (device-width: 834px) and (device-height: 1194px) and (-webkit-device-pixel-ratio: 2) and (orientation: portrait)" href="/splash/iPad_Pro_11.png" />
  <link rel="apple-touch-startup-image" media="screen and (device-width: 834px) and (device-height: 1112px) and (-webkit-device-pixel-ratio: 2) and (orientation: portrait)" href="/splash/iPad_Air_10.5.png" />
  <link rel="apple-touch-startup-image" media="screen and (device-width: 768px) and (device-height: 1024px) and (-webkit-device-pixel-ratio: 2) and (orientation: portrait)" href="/splash/iPad_Mini.png" />
  <link rel="apple-touch-startup-image" media="screen and (device-width: 1024px) and (device-height: 1366px) and (-webkit-device-pixel-ratio: 2) and (orientation: portrait)" href="/splash/iPad_Pro_12.9.png" />
    <link rel="manifest" href="/manifest.json" />
    <!-- PWA meta -->
    <meta name="theme-color" content="#000000" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <!-- `black`, NIET `black-translucent`. iOS 26 heeft een WebKit-regressie
         (bug 301108): een geïnstalleerde PWA met black-translucent +
         viewport-fit=cover tekent vanaf de bovenrand, maar maakt het venster
         een statusbalk te kort. Gemeten op Luka's iPhone (402×874): de app
         tekende tot 812, daaronder 62pt zwart dat geen CSS kan bereiken --
         100dvh, 100%, innerHeight en visualViewport zijn allemaal 812. Acht
         commits op 26/27 sep zochten de fout in de plaat; hij zat hier.
         Met `black` begint het venster onder de statusbalk en loopt het door
         tot de onderrand, zodat de plaat bij de home-indicator kan komen.
         iOS leest deze tag alleen bij installeren: app van het beginscherm
         halen en opnieuw toevoegen. Tauri en Android lezen hem niet. -->
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <meta name="apple-mobile-web-app-title" content="AXE CORE" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="application-name" content="AXE CORE" />
    <style>
      /* ================================================================
         CRITICAL: Every element in the chain must fill the viewport
         with black background. ANY gap = white bar visible.
         ================================================================ */
      /* Lock the app to exactly the viewport height with NO document scroll —
         the whole thing is an app shell, only the content area inside scrolls.
         Using fixed height + overflow:hidden (not min-height) is what keeps the
         bottom nav pinned on iPad/mobile PWA; min-height let the page grow past
         the screen and the nav "scrolled away". */
      html {
        height: 100vh;
        height: 100dvh;
        background: #000000;
        overflow: hidden;
      }
      body {
        margin: 0;
        padding: 0;
        height: 100vh;
        height: 100dvh;
        background: #000000;
        overflow: hidden;
        overscroll-behavior: none;
        -webkit-tap-highlight-color: transparent;
        color-scheme: dark;
      }
      #root {
        height: 100%;
        background: #000000;
        display: flex;
        flex-direction: column;
        overflow: hidden;
      }
      /* iOS Safe Area — only left/right here (landscape notch). Top and bottom
         insets are handled INSIDE the app chrome (TopNav pads the top, BottomNav
         the bottom); adding them to <body> too made the document taller than the
         viewport, which is exactly what pushed the bottom nav off-screen. */
      @supports (padding: max(0px)) {
        body {
          padding-left: env(safe-area-inset-left);
          padding-right: env(safe-area-inset-right);
        }
      }
      /* iOS PWA: standalone app feel */
      @media (display-mode: standalone) {
        body {
          overscroll-behavior-y: none;
          user-select: none;
          -webkit-user-select: none;
        }
      }
      @media (display-mode: fullscreen) {
        body {
          overscroll-behavior-y: none;
        }
      }
      .scrollable {
        overflow-y: auto;
        -webkit-overflow-scrolling: touch;
        overscroll-behavior-y: contain;
      }
      .no-select {
        -webkit-user-select: none;
        user-select: none;
      }
      /* De strook onder de iOS-statusbalk. iOS 26 kleurt die balk naar het
         vaste element dat bovenaan de pagina ligt, en kijkt alleen bij het
         opstarten en als zo'n element verschijnt of verdwijnt. Gemeten op
         Luka's iPhone (28 sep): na installeren lichtblauw, na look wisselen
         nog steeds, pas na de zijlade open en dicht zwart -- die lade is
         precies zo'n vast element. Deze strook is er vanaf de eerste frame,
         altijd zwart, over de volle breedte en bovenop alles. Hij is zo hoog
         als de ruimte boven de plaat (2px), dus je ziet hem niet: hij loopt
         door in de zwarte balk. Alleen in de iPhone-app (data-ios-pwa). */
      #axe-ios-balk { display: none; }
      html[data-ios-pwa] #axe-ios-balk {
        display: block;
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        height: calc(env(safe-area-inset-top, 0px) + 2px);
        background-color: #000;
        z-index: 2147483647;
      }
    </style>
    <script>
      /* De plaat-stand vóór React.
       *
       * useLook zet `data-look` op <html> pas nadat React gemount is. Tot dat
       * moment slaat design/axe-look.css nergens op aan: de tegels onder de
       * nav-iconen, de plaat, de rails -- allemaal even in hun oude vorm, en
       * dan springen ze. Je ziet de blokjes onder de iconen verdwijnen en
       * terugkomen.
       *
       * Dit leest dezelfde sleutel als useLook en zet het attribuut voordat er
       * ook maar iets getekend is. Faalt het (privémodus), dan gebeurt er niets
       * bijzonders: React zet hem alsnog, precies zoals eerst. */
      try {
        var l = localStorage.getItem('axe_look');
        if (l === 'glass' || l === 'black') document.documentElement.dataset.look = l;
      } catch (e) { /* privémodus -- React doet het straks */ }
      /* De iPhone-app van het beginscherm. navigator.standalone bestaat
       * alleen in iOS-WebKit en is alleen true voor een geïnstalleerde
       * web-app -- niet in Safari, niet in Tauri, niet op Android. axe-look.css
       * geeft html/body daarop een zwarte achtergrond: iOS 26 kleurt de
       * statusbalk naar de body (theme-color negeert hij), en die is voor het
       * Mac-glas doorzichtig. Doorzichtig gaf een lichtblauwe balk. */
      if (window.navigator.standalone === true) {
        document.documentElement.dataset.iosPwa = '1';
        /* Een verse installatie heeft nog geen look. De standaard is licht
         * (glass), en die lichte lucht stond er precies op het moment dat iOS
         * de statusbalk afleest. Op de telefoon dus donker beginnen; de
         * cloud-keuze neemt het daarna over (useLook). */
        try {
          if (!localStorage.getItem('axe_look')) {
            localStorage.setItem('axe_look', 'black');
            document.documentElement.dataset.look = 'black';
          }
        } catch (e) { /* privémodus */ }
      }
    </script>
  </head>
  <body>
    <div id="axe-ios-balk" aria-hidden="true"></div>
    <div id="root"></div>
    <script type="module" src="/src/app/main.tsx"></script>
  </body>
</html>
