name: Apply design-agent wire

on:
  push:
    branches: [feature/codeeditor-design-agent-wire]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/codeeditor-design-agent-wire
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Apply wire patch
        run: bash scripts/apply-design-wire.sh

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- AXE-CORE-ORCHESTRATOR-content/AXE-CORE-HEADQUARTERS/src/presentation/pages/CodeEditorPage.tsx; then
            echo "No changes"
            exit 0
          fi
          git add AXE-CORE-ORCHESTRATOR-content/AXE-CORE-HEADQUARTERS/src/presentation/pages/CodeEditorPage.tsx
          git commit -m "feat: wire Design Mode → Code Agent in CodeEditorPage"
          git push
