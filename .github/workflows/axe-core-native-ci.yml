name: AXE CORE Native CI

on:
  pull_request:
    paths:
      - 'AXE-CORE-ORCHESTRATOR-content/AXE-CORE-HEADQUARTERS/**'
      - '.github/workflows/axe-core-native-ci.yml'
  push:
    branches: [orchestrator]
    paths:
      - 'AXE-CORE-ORCHESTRATOR-content/AXE-CORE-HEADQUARTERS/**'
      - '.github/workflows/axe-core-native-ci.yml'

concurrency:
  group: axe-core-native-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: AXE-CORE-ORCHESTRATOR-content/AXE-CORE-HEADQUARTERS

jobs:
  app:
    name: Typecheck, tests and web builds
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: AXE-CORE-ORCHESTRATOR-content/AXE-CORE-HEADQUARTERS/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm test
      - run: npm run build:web
      - run: npm run build:runner

  macos-native:
    name: macOS native helpers and Tauri compile
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: AXE-CORE-ORCHESTRATOR-content/AXE-CORE-HEADQUARTERS/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - run: npm ci --no-audit --no-fund
      - name: Build stable macOS helpers
        run: |
          bash infra/computer-worker/native/build.sh
          bash infra/computer-worker/camera/build.sh
      - name: Create compile-only desktop env
        run: |
          cat > .env <<'EOF'
          VITE_SUPABASE_URL=https://ci-placeholder.supabase.co
          VITE_SUPABASE_ANON_KEY=ci-placeholder
          VITE_AXE_CORE_API_KEY=ci-placeholder
          EOF
      - name: Build Tauri bundle
        env:
          CI: '1'
        run: npm run tauri:build
