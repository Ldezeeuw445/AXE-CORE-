name: Mobile Native CI

on:
  push:
    branches:
      - fix/mobile-native-render
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: AXE-CORE-ORCHESTRATOR-content/AXE-CORE-HEADQUARTERS
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: AXE-CORE-ORCHESTRATOR-content/AXE-CORE-HEADQUARTERS/package-lock.json
      - name: Install
        run: npm ci --no-audit --no-fund
      - name: Typecheck
        run: npm run typecheck
      - name: Mobile wiring tests
        run: npx vitest run src/presentation/pages/MobileSystem.wiring.test.ts
      - name: Production web build
        run: npm run build
