name: Tauri compile check (macOS)

# Compilatiecontrole zonder distributieartifact of ingebouwde backendsleutel.
# Installatie op beide Macs blijft via de bestaande canonieke autosync lopen.
# GitHub Actions is billing-locked on this account, so a push trigger only
# paints the commit red. The real macOS build is `npm run bijwerken` on the
# Mac mini (and autosync on both Macs). Keep the file for a manual run.
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: tauri-macos-${{ github.ref }}
  cancel-in-progress: true
env:
  HQ: AXE-CORE-ORCHESTRATOR-content/AXE-CORE-HEADQUARTERS
  VITE_SUPABASE_URL: https://pqnngpcgbdwxavbatbia.supabase.co
  VITE_SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InBxbm5ncGNnYmR3eGF2YmF0YmlhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzQ4Nzc1ODgsImV4cCI6MjA5MDQ1MzU4OH0.S9DOUSTmNFfehOo5vY7JGce7wCTDyHqVciWKHJP48N8
  # Alleen de frontend-bouwcontrole; dit resultaat wordt niet geïnstalleerd.
  ANDROID_SHELL: '1'
jobs:
  compile-macos:
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: ${{ env.HQ }}/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: ${{ env.HQ }}/src-tauri -> target
      - name: Frontend dependencies
        working-directory: ${{ env.HQ }}
        run: npm ci
      - name: Compile Tauri without distributing a bundle
        working-directory: ${{ env.HQ }}
        env:
          CI: 'true'
        run: npx tauri build --no-bundle
