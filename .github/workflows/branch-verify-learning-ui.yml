name: Branch Verify — Learning + Shell

on:
  push:
    branches:
      - fix/learning-loop-trading-agents-20260921

concurrency:
  group: branch-verify-learning-shell-${{ github.ref }}
  cancel-in-progress: true

env:
  HQ: AXE-CORE-ORCHESTRATOR-content/AXE-CORE-HEADQUARTERS

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: ${{ env.HQ }}/package-lock.json

      - name: Install
        working-directory: ${{ env.HQ }}
        run: npm ci

      - name: Typecheck
        working-directory: ${{ env.HQ }}
        run: npm run typecheck

      - name: Targeted tests
        working-directory: ${{ env.HQ }}
        run: >
          npx vitest run
          src/domain/memory/agentLoop.test.ts
          src/infrastructure/persistence/beurtNaarEpisode.test.ts
          src/infrastructure/persistence/tradingAgentMemoryService.test.ts
          src/infrastructure/gateways/openAiTtsService.test.ts
